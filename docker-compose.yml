version: '3.8'

services:
  backend:
    build: ./backend
    container_name: fueltrack-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/fuelstation
      - JWT_SECRET=super_secret_jwt_key_change_in_production
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: fueltrack-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: