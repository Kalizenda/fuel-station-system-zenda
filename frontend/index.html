<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FuelTrack NG | AJ JASPER OIL AND GAS Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-header">
      <h1>⛽ AJ JASPER OIL AND GAS</h1>
      <p>Station Management System</p>
    </div>
    <form id="loginForm" class="auth-form" autocomplete="off">
      <h2>Sign In</h2>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required placeholder="admin@fueltrack.ng" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
      <p id="error-msg" class="error-text"></p>
    </form>
    <div class="theme-toggle">
      <button id="themeSwitch">🌙 Toggle Dark Mode</button>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</body>
</html>
