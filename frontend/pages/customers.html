<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Customers | AJ JASPER OIL AND GAS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">⛽ AJ JASPER OIL AND GAS</div>
      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
        <a href="deliveries.html" class="nav-link">🚛 Deliveries</a>
        <a href="sales.html" class="nav-link">💰 Sales</a>
        <a href="customers.html" class="nav-link active">👤 Customers</a>
        <a href="tanks.html" class="nav-link">🛢️ Tanks</a>
        <a href="prices.html" class="nav-link">💲 Prices</a>
        <a href="pump-assignment.html" class="nav-link">⛽ Pump Assignment</a>
        <a href="profit.html" class="nav-link">📈 Profit</a>
        <a href="staff.html" class="nav-link">👥 Staff</a>
        <a href="admin.html" class="nav-link">⚙️ Admin</a>
        <a href="reports.html" class="nav-link">📄 Reports</a>
        <a href="analytics.html" class="nav-link">📉 Analytics</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <h2>Customer Management</h2>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <div class="theme-switcher">
            <button id="themeLight" class="theme-btn" data-theme="light" title="Light Mode">☀️</button>
            <button id="themeDark" class="theme-btn" data-theme="dark" title="Dark Mode">🌙</button>
            <button id="themeColored" class="theme-btn" data-theme="colored" title="Colored Mode">🎨</button>
          </div>
          <span id="userName">Admin</span>
        </div>
      </header>
      <div class="content-area">
        <div class="form-card">
          <h3>Add New Customer</h3>
          <form id="customerForm">
            <div class="form-row">
              <div class="form-group">
                <label>Customer Name</label>
                <input type="text" id="name" required>
              </div>
              <div class="form-group">
                <label>Contact Person</label>
                <input type="text" id="contactPerson">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" required>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="email">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Customer Type</label>
                <select id="customerType" required>
                  <option value="Individual">Individual</option>
                  <option value="Corporate">Corporate</option>
                  <option value="Fleet">Fleet</option>
                </select>
              </div>
              <div class="form-group">
                <label>Credit Limit (₦)</label>
                <input type="number" id="creditLimit" value="0">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Discount Rate (%)</label>
                <input type="number" id="discountRate" value="0" step="0.1">
              </div>
              <div class="form-group">
                <label>Status</label>
                <select id="status">
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                  <option value="Blacklisted">Blacklisted</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Address</label>
              <textarea id="address" rows="2"></textarea>
            </div>
            <div class="form-group">
              <label>Vehicle Registration Numbers (comma separated)</label>
              <input type="text" id="vehicles" placeholder="ABC-123-XY, DEF-456-ZW">
            </div>
            <button type="submit" class="btn btn-primary">Add Customer</button>
          </form>
        </div>

        <div class="card">
          <h3>Customer List</h3>
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Phone</th>
                <th>Credit Limit</th>
                <th>Balance</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="customerTable"><tr><td colspan="7">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/guard.js"></script>
  <script src="../js/theme-switcher.js"></script>
  <script>
    const token = localStorage.getItem('token');

    async function loadCustomers() {
      try {
        const res = await fetch('http://localhost:5000/api/customers', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        const tbody = document.getElementById('customerTable');
        if (data.data && data.data.length > 0) {
          tbody.innerHTML = data.data.map(c => `
            <tr>
              <td>${c.name}</td>
              <td>${c.customerType}</td>
              <td>${c.phone}</td>
              <td>₦${c.creditLimit.toLocaleString()}</td>
              <td>₦${c.currentBalance.toLocaleString()}</td>
              <td><span class="status-${c.status.toLowerCase()}">${c.status}</span></td>
              <td>
                <button onclick="editCustomer('${c._id}')" class="btn btn-sm">Edit</button>
                <button onclick="deleteCustomer('${c._id}')" class="btn btn-sm btn-danger">Delete</button>
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="7">No customers found</td></tr>';
        }
      } catch (err) {
        console.error('Error loading customers:', err);
        document.getElementById('customerTable').innerHTML = '<tr><td colspan="7">Error loading customers</td></tr>';
      }
    }

    document.getElementById('customerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        contactPerson: document.getElementById('contactPerson').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        customerType: document.getElementById('customerType').value,
        creditLimit: parseFloat(document.getElementById('creditLimit').value) || 0,
        discountRate: parseFloat(document.getElementById('discountRate').value) || 0,
        status: document.getElementById('status').value,
        address: document.getElementById('address').value,
        vehicles: document.getElementById('vehicles').value.split(',').map(v => v.trim()).filter(v => v)
      };

      try {
        const res = await fetch('http://localhost:5000/api/customers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          alert('Customer added successfully!');
          e.target.reset();
          loadCustomers();
        } else {
          alert('Error: ' + (data.message || 'Failed to add customer'));
        }
      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
      }
    });

    async function deleteCustomer(id) {
      if (!confirm('Are you sure you want to delete this customer?')) return;
      try {
        const res = await fetch(`http://localhost:5000/api/customers/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          alert('Customer deleted successfully');
          loadCustomers();
        } else {
          alert('Failed to delete customer');
        }
      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
      }
    }

    loadCustomers();
  </script>
</body>
</html>
