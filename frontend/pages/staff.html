<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Staff | AJ JASPER OIL AND GAS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">⛽ AJ JASPER OIL AND GAS</div>
      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-link">📊 Dashboard</a>
        <a href="deliveries.html" class="nav-link">🚛 Deliveries</a>
        <a href="sales.html" class="nav-link">💰 Sales</a>
        <a href="customers.html" class="nav-link">👤 Customers</a>
        <a href="tanks.html" class="nav-link">🛢️ Tanks</a>
        <a href="prices.html" class="nav-link">💲 Prices</a>
        <a href="pump-assignment.html" class="nav-link">⛽ Pump Assignment</a>
        <a href="profit.html" class="nav-link">📈 Profit</a>
        <a href="staff.html" class="nav-link active">👥 Staff</a>
        <a href="admin.html" class="nav-link">⚙️ Admin</a>
        <a href="reports.html" class="nav-link">📄 Reports</a>
        <a href="analytics.html" class="nav-link">📉 Analytics</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <h2>Staff Management</h2>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <div class="theme-switcher">
            <button id="themeLight" class="theme-btn" data-theme="light" title="Light Mode">☀️</button>
            <button id="themeDark" class="theme-btn" data-theme="dark" title="Dark Mode">🌙</button>
            <button id="themeColored" class="theme-btn" data-theme="colored" title="Colored Mode">🎨</button>
          </div>
          <span id="userName">Admin</span>
        </div>
      </header>
      <div class="content-area">
        <div class="form-card">
          <h3>Add New Staff</h3>
          <form id="staffForm">
            <div class="form-row">
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" required>
              </div>
              <div class="form-group">
                <label>Position</label>
                <select id="position" required>
                  <option value="Manager">Manager</option>
                  <option value="Attendant">Attendant</option>
                  <option value="Cashier">Cashier</option>
                  <option value="Supervisor">Supervisor</option>
                  <option value="Security">Security</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" required>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="email">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Salary (₦)</label>
                <input type="number" id="salary" required>
              </div>
              <div class="form-group">
                <label>Shift</label>
                <select id="shift">
                  <option value="Morning">Morning (6AM - 2PM)</option>
                  <option value="Afternoon">Afternoon (2PM - 10PM)</option>
                  <option value="Night">Night (10PM - 6AM)</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Status</label>
              <select id="status">
                <option value="Active">Active</option>
                <option value="On Leave">On Leave</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">Add Staff</button>
          </form>
        </div>

        <div class="card">
          <h3>Staff List</h3>
          <table class="data-table">
            <thead><tr><th>Name</th><th>Position</th><th>Phone</th><th>Shift</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="staffTable"><tr><td colspan="6">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/guard.js"></script>
  <script src="../js/theme-switcher.js"></script>
  <script>
    const token = localStorage.getItem('token');

    async function loadStaff() {
      console.log('Loading staff data...');
      try {
        const res = await fetch('http://localhost:5000/api/staff', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        console.log('Staff API response status:', res.status);
        const data = await res.json();
        console.log('Staff data received:', data);
        const tbody = document.getElementById('staffTable');
        if (data.data && data.data.length > 0) {
          tbody.innerHTML = data.data.map(s => `
            <tr>
              <td>${s.fullName}</td>
              <td>${s.position}</td>
              <td>${s.phone}</td>
              <td>${s.shift || 'N/A'}</td>
              <td><span class="status-${s.status?.toLowerCase().replace(' ', '-')}">${s.status || 'Active'}</span></td>
              <td>
                <button onclick="deleteStaff('${s._id}')" class="btn btn-sm btn-danger">Delete</button>
              </td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="6">No staff data available</td></tr>';
        }
      } catch (err) { 
        console.error('Error loading staff:', err);
        document.getElementById('staffTable').innerHTML = '<tr><td colspan="6">Error: ' + err.message + '</td></tr>'; 
      }
    }

    document.getElementById('staffForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        fullName: document.getElementById('fullName').value,
        position: document.getElementById('position').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        salary: parseFloat(document.getElementById('salary').value),
        shift: document.getElementById('shift').value,
        status: document.getElementById('status').value
      };

      try {
        const res = await fetch('http://localhost:5000/api/staff', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          alert('Staff added successfully!');
          e.target.reset();
          loadStaff();
        } else {
          alert('Error: ' + (data.message || 'Failed to add staff'));
        }
      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
      }
    });

    async function deleteStaff(id) {
      if (!confirm('Are you sure you want to delete this staff member?')) return;
      try {
        const res = await fetch(`http://localhost:5000/api/staff/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          alert('Staff deleted successfully');
          loadStaff();
        } else {
          alert('Failed to delete staff');
        }
      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
      }
    }

    loadStaff();
  </script>
</body>
</html>
